<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Library Management System</title>

    <script src="https://cjrtnc.leaningtech.com/4.0/loader.js"></script>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0f172a;
            color: white;
            font-family: Arial, sans-serif;
        }

        #loading {
            text-align: center;
            font-size: 20px;
        }
    </style>

</head>

<body>

<div id="loading">
    Starting Library Management System...
</div>


<script>

async function startJavaApp() {

    try {

        console.log("Starting CheerpJ...");

        await cheerpjInit();

        console.log("CheerpJ Ready");


        cheerpjCreateDisplay(1000, 700);


        document.getElementById("loading").style.display = "none";


        await cheerpjRunJar(
            "/app/LibraryManagementSystem.jar"
        );


    } catch(error) {

        console.error("Application Error:", error);

        document.getElementById("loading").innerHTML =
        "Error loading Java Application";

    }

}


window.onload = startJavaApp;

</script>


</body>

</html>
