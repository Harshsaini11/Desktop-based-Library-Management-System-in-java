<!DOCTYPE html>
<html>
<head>
    <title>Library Management System</title>

    <script src="https://cjrtnc.leaningtech.com/4.0/loader.js"></script>
</head>

<body>

<h2>Library Management System</h2>

<script>
async function startApp() {

    console.log("Starting CheerpJ...");

    await cheerpjInit();

    console.log("CheerpJ Ready");

    cheerpjCreateDisplay(900, 700);

    cheerpjRunMain(
        "harshsaini.LibraryManagementSystem",
        "/app/LibraryManagementSystem.jar"
    );

}

startApp();

</script>

</body>
</html>
