<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Management System</title>
    <link rel="icon" href="data:,">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            width: 100vw;
            height: 100vh;
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        #header {
            padding: 12px 20px;
            background-color: #1e293b;
            border-bottom: 1px solid #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #status {
            font-size: 0.9rem;
            color: #38bdf8;
            font-weight: 500;
        }
        #cheerpjDisplay {
            flex: 1;
            width: 100%;
            height: calc(100vh - 50px);
            background-color: #0f172a;
        }
    </style>
</head>
<body>

<div id="header">
    <h3>📚 Library Management System</h3>
    <p id="status">Connecting to CheerpJ Engine...</p>
</div>

<!-- Swing Window Display Area -->
<div id="cheerpjDisplay"></div>

<script>
    // List of CDNs to try (Primary + Fallback)
    const cdnUrls = [
        "https://cjrtnc.leaningtech.com/3.0/cj3load.js",
        "https://cdn.jsdelivr.net/npm/@leaningtech/cheerpj@3.0.0/cj3load.js"
    ];

    function loadScript(url) {
        return new Promise((resolve, reject) => {
            const script = document.createElement("script");
            script.src = url;
            script.onload = () => resolve(url);
            script.onerror = () => reject(new Error("Failed to load: " + url));
            document.head.appendChild(script);
        });
    }

    async function initApp() {
        const status = document.getElementById("status");
        let scriptLoaded = false;

        // Try loading CDNs one by one
        for (const url of cdnUrls) {
            try {
                status.innerText = "Loading CheerpJ library...";
                await loadScript(url);
                scriptLoaded = true;
                break;
            } catch (err) {
                console.warn(err.message + " - Trying backup CDN...");
            }
        }

        if (!scriptLoaded || typeof cheerpjInit === "undefined") {
            status.innerText = "ERROR: Could not load CheerpJ CDN. Please check internet/AdBlocker.";
            status.style.color = "#ef4444";
            return;
        }

        try {
            status.innerText = "Initializing CheerpJ Engine...";
            await cheerpjInit();

            // Attach Swing Display to DIV
            cheerpjCreateDisplay(-1, -1, document.getElementById("cheerpjDisplay"));

            status.innerText = "Starting Application...";

            // Launch Application Main Class and JAR
            await cheerpjRunMain("harshsaini.LibraryManagementSystem", "/app/LibraryManagementSystem.jar");

            status.innerText = "Application Running";
            status.style.color = "#4ade80";
        } catch (e) {
            console.error("App Launch Error:", e);
            status.innerText = "ERROR: " + e.message;
            status.style.color = "#ef4444";
        }
    }

    window.addEventListener("DOMContentLoaded", initApp);
</script>

</body>
</html>
