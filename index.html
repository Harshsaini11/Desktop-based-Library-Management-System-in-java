```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Management System</title>

    <link rel="icon" href="data:,">
</head>

<body>

<h2>Library Management System</h2>
<p id="status">Loading...</p>

<script>
const script = document.createElement("script");
script.src = "https://cdn.leaningtech.com/cheerpj/latest/loader.js";

script.onload = async () => {
    try {
        document.getElementById("status").innerText =
            "CheerpJ runtime ready";

        await cheerpjInit();

        // GitHub Pages par same folder me rakhi JAR
        await cheerpjRunJar("LibraryManagementSystem.jar");

        document.getElementById("status").innerText =
            "Java application started successfully";

    } catch (err) {
        console.error(err);

        document.getElementById("status").innerText =
            "ERROR: " + err.message;
    }
};

script.onerror = () => {
    document.getElementById("status").innerText =
        "Failed to load CheerpJ loader";
};

document.head.appendChild(script);
</script>

</body>
</html>
