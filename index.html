```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Management System</title>

    <!-- favicon 404 error avoid -->
    <link rel="icon" href="data:,">
</head>

<body>
    <h1>Library Management System</h1>
    <p id="status">Loading Java application...</p>

    <script>
        // Loader dynamically add karo
        const script = document.createElement("script");
        script.src = "https://cdn.leaningtech.com/cheerpj/latest/loader.js";

        script.onload = async function () {
            try {
                document.getElementById("status").innerText = "Initializing CheerpJ...";

                // CheerpJ initialize
                await cheerpjInit();

                document.getElementById("status").innerText = "Starting Library Management System...";

                // JAR file run karo
                await cheerpjRunJar("./LibraryManagementSystem.jar");

                document.getElementById("status").innerText = "Application started successfully";
            } catch (err) {
                console.error(err);
                document.getElementById("status").innerText =
                    "Error: " + err.message;
            }
        };

        script.onerror = function () {
            document.getElementById("status").innerText =
                "Failed to load CheerpJ loader";
        };

        document.head.appendChild(script);
    </script>
</body>
</html>
