<!DOCTYPE html>
<html>
<head>
    <title>Library Management System</title>

    <script src="https://cjrtnc.leaningtech.com/4.3/loader.js"></script>

    <style>
        body{
            margin:0;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:#111827;
            color:white;
            font-family:Arial;
        }
    </style>

</head>

<body>

<h2 id="msg">Loading Library Management System...</h2>

<script>

async function runApp(){

    try{

        console.log("Starting CheerpJ...");

        await cheerpjInit();

        console.log("CheerpJ Ready");

        cheerpjCreateDisplay(1000,700);

        document.getElementById("msg").style.display="none";

        cheerpjRunJar(
            "https://github.com/Harshsaini11/Desktop-based-Library-Management-System-in-java/blob/main/LibraryManagementSystem.jar"
        );

    }
    catch(e){

        console.error("CheerpJ Error:",e);

    }

}

window.onload = runApp;

</script>

</body>
</html>
